name: DevSecOps SAST - Semgrep

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep-sast:
    name: Semgrep SAST Analysis & Security Gate
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Scan de visibilidade:
      # gera o relatório SARIF para integração com GitHub Code Scanning.
      # Os findings não bloqueiam este step porque o enforcement
      # será realizado posteriormente pelo Security Gate.
      - name: Step 1 - Generate SARIF Report (Visibility)
        run: |
          semgrep scan \
            --config=p/php \
            --config=p/security-audit \
            --sarif \
            --output=semgrep.sarif \
            .
        continue-on-error: true

      - name: Step 2 - Check SARIF Report
        id: sarif
        shell: sh
        run: |
          if [ -f semgrep.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Step 3 - Upload SARIF Report to GitHub Code Scanning
        if: steps.sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast

      # Security Gate:
      # --error faz a execução retornar falha quando o Semgrep
      # encontrar findings correspondentes às regras executadas.
      - name: Step 4 - Semgrep Security Gate (Enforcement / Blocking)
        run: |
          semgrep scan \
            --config=p/php \
            --config=p/security-audit \
            --error \
            .