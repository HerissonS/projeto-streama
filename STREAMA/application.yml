environments:
    production:
        dataSource:
            driverClassName: 'com.mysql.jdbc.Driver'
            #driverClassName: 'com.mysql.cj.jdbc.Driver'
            url: "jdbc:mysql://${DB_HOST:colocar_seu_link_db}/${DB_NAME:nome_db}"
            username: ${DB_USER:admin}
            password: '${DB_PASSWORD:altere_sua_senha_db}'
            #port: 3306
        server:
            port: 8080
streama:
  uploadtypes: ['video/h264', 'video/mp4', 'video/mpeg', 'video/quicktime', 'video/webm', 'video/x-ms-wm', 'video/x-ms-wmv',
              'video/x-msvideo', 'image/bmp', 'image/gif', 'image/jpeg', 'image/pjpeg', 'image/png', 'image/svg+xml',
              'image/x-icon', 'image/x-png', 'application/x-subrip', 'text/plain', 'text/vtt', 'text/plain', 'application/octet-stream']
grails:
   mail:
     host: mail

grails.plugin.springsecurity.providerNames:
    - daoAuthenticationProvider
    - ldapAuthProvider
    - anonymousAuthenticationProvider
    - rememberMeAuthenticationProvider
    
grails.plugin.springsecurity.ldap:
    context:
        managerDn: '${LDAP_ADMIN_DN:cn=admin,dc=g2cloud,dc=com}'
        managerPassword: '${LDAP_ADMIN_PASSWORD:altere_sua_senha_admin}'
        server: '${LDAP_SERVER:ldap://127.0.0.1:389}'
    search:
        base: '${LDAP_BASE_DN:dc=g2cloud,dc=com}'
        filter: 'cn={0}'
        searchSubtree: true
        attributesToReturn: ['mail', 'displayName']
    auth:
        hideUserNotFoundExceptions: false
    useRememberMe: false
    authorities:
        ignorePartialResultException: true
        retrieveDatabaseRoles: false
        retrieveGroupRoles: false